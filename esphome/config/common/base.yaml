esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.3.3

  on_boot:
    priority: 260
    then:
      - select.set:
          id: temperature_source_select
          option: "Thermostat"

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source: github://muart-group/esphome-components@v1
    components: [ mitsubishi_itp ]

ota:
  - platform: esphome
    password: ${ota_password}

api:
  encryption:
    key: ${api_encryption_key}

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  - id: iu_uart
    baud_rate: 2400
    parity: EVEN
    rx_pin: GPIO21
    tx_pin: GPIO20
  - id: wr_uart
    baud_rate: 2400
    parity: EVEN
    rx_pin: GPIO18
    tx_pin: GPIO19

climate:
  - platform: mitsubishi_itp
    id: heat_pump
    name: "Thermostat"
    icon: mdi:heat-pump
    uart_heatpump: iu_uart
    uart_thermostat: wr_uart
    supported_modes:
      - 'OFF'
      - HEAT
      - COOL
      - FAN_ONLY
      - DRY
    supported_fan_modes:
      - AUTO
      - QUIET
      - LOW
      - MEDIUM
      - HIGH
    custom_fan_modes:
      - VERYHIGH
    # enhanced_mhk: True
    mhk_fahrenheit_correction: true
    visual:
      temperature_step:
        target_temperature: 1.0
        current_temperature: 1.0
    update_interval: 10s

select:
  - platform: mitsubishi_itp
    temperature_source:
      name: "Temperature Source"
      id: temperature_source_select
      sources: []
    vane_position:
      name: "Vane Position"
    horizontal_vane_position:
      name: "H. Vane Position"

text_sensor:
  - platform: mitsubishi_itp
    actual_fan:
      name: "Actual Fan"
    error_code:
      name: "Error Code"

# Default logging level
logger:
  baud_rate: 0
  level: DEBUG
  logs:
    EVT_SETS : DEBUG
    WIFI : INFO
    MQTT : INFO
    WRITE_SETTINGS : DEBUG
    SETTINGS : DEBUG
    STATUS : INFO
    CN105Climate: WARN
    CN105: DEBUG
    climate: WARN
    sensor: WARN
    chkSum : INFO
    WRITE : WARN
    READ : WARN
    Header: INFO
    Decoder : DEBUG
    CONTROL_WANTED_SETTINGS: DEBUG
